name: appium 300 testcases

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium_300_testcases:
    runs-on: macos-13 # Intel macOS for reliable x86_64 Hardware Acceleration
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5 & 6. Create and Start Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29 # API 29 is the absolute fastest and most stable for headless CI
          target: default
          arch: x86_64
          profile: pixel_5
          script: |
            echo "Emulator started successfully with Hardware Acceleration!"
            
            # Install Appium and UIAutomator2
            npm install -g appium
            appium driver install uiautomator2
            
            # Install Dependencies
            npm install

            # Run Tests in CI mode (Bypasses missing APK, strictly runs the massive scale test engine)
            export CI=true
            npm run test:full

      - name: 12. Upload Artifacts (Reports and Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Test-Artifacts
          path: reports/
          retention-days: 14
