name: Enterprise Master QA Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium_mobile_tests:
    name: 1. Appium Mobile E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: appium-tests/package-lock.json
      - run: npm ci
        working-directory: appium-tests
      - run: node tests/app-tests.js
        working-directory: appium-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Appium_Mobile_Report
          path: appium-tests/*.xlsx

  selenium_web_tests:
    name: 2. Selenium Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: selenium-tests/package-lock.json
      - run: npm ci
        working-directory: selenium-tests
      - run: node tests/login-tests.js
        working-directory: selenium-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Selenium_Web_Report
          path: selenium-tests/*.xlsx

  security_devsecops:
    name: 3. DevSecOps Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: security-tests/package-lock.json
      - run: npm ci
        working-directory: security-tests
      - run: node tests/security-tests.js
        working-directory: security-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Security_Assessment_Report
          path: security-tests/*.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: Security_Markdown_Summaries
          path: security-tests/Vulnerability Test Results/*.md

  load_performance:
    name: 4. Load & Performance Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: load-tests/package-lock.json
      - run: npm ci
        working-directory: load-tests
      - run: node tests/load-tests.js
        working-directory: load-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Load_Performance_Report
          path: load-tests/*.xlsx
