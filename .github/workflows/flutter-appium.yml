name: Flutter Appium E2E Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Run Massive 1200 Test Suite
      run: |
        npm run test:ci || true
        node utils/excelReporter.js

    - name: Upload Mochawesome Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-report
        path: reports/html/

    - name: Upload Excel Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: excel-report
        path: reports/Flutter_E2E_Report.xlsx

    - name: Upload Failure Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: failure-screenshots-and-logs
        path: reports/failures/
