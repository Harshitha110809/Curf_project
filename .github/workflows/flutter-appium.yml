name: Flutter Appium E2E Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: macos-latest # macOS runners support hardware acceleration for Android emulators

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Run Android Emulator and Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_6
        script: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver install flutter
          appium --log reports/logs/appium.log &
          sleep 10
          npm ci
          # Run tests and ensure excel report is generated even if tests fail
          npm run test:ci || true
          node utils/excelReporter.js

    - name: Upload Mochawesome Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-report
        path: reports/html/

    - name: Upload Excel Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: excel-report
        path: reports/Flutter_E2E_Report.xlsx

    - name: Upload Failure Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: failure-screenshots-and-logs
        path: reports/failures/
